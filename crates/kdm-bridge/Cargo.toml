[package]
name = "kdm-bridge"
description = "Karadelik Download Manager tarayıcı köprüsü: yerel WebSocket sunucusu ve native messaging kayıtları"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Yalnız sunucu el sıkışması; TLS gerekmez (yalnız 127.0.0.1)
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rand = "0.9"
log = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
sha2 = "0.10"
base64 = "0.22"
