<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karadelik Download Manager</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/dm.css">
</head>
<body>
<div class="app" id="app">
  <header class="titlebar" data-tauri-drag-region>
    <div class="brand" data-tauri-drag-region>
      <img src="img/logo.png" alt="" draggable="false">
      <span class="name" data-tauri-drag-region>Karadelik DM</span>
    </div>
    <div class="tb-group">
      <button class="tb" id="resumeBtn" data-i18n-title="tb.resume" data-i18n-aria="tb.resume"><span data-icon="play"></span></button>
      <button class="tb" id="stopBtn" data-i18n-title="tb.stop" data-i18n-aria="tb.stop"><span data-icon="pause"></span></button>
      <button class="tb" id="stopAllBtn" data-i18n-title="tb.stop_all" data-i18n-aria="tb.stop_all"><span data-icon="stop"></span></button>
      <button class="tb" id="removeBtn" data-i18n-title="tb.remove" data-i18n-aria="tb.remove"><span data-icon="trash"></span></button>
    </div>
    <div class="tb-group">
      <button class="tb" id="queueBtn"><span data-icon="queue"></span></button>
      <button class="tb" id="schedBtn" data-i18n-title="tb.scheduler" data-i18n-aria="tb.scheduler"><span data-icon="clock"></span></button>
      <button class="tb" id="grabBtn" data-i18n-title="tb.grabber" data-i18n-aria="tb.grabber"><span data-icon="grabber"></span></button>
    </div>
    <div class="title-spacer" data-tauri-drag-region></div>
    <label class="search-pill">
      <span data-icon="search"></span>
      <input id="search" type="search" data-i18n-ph="ui.search" data-i18n-aria="ui.search" spellcheck="false">
      <kbd id="searchKey">Ctrl F</kbd>
    </label>
    <button class="add-btn" id="addBtn" data-i18n-title="tb.add"><span data-icon="add"></span><span data-i18n="tb.add">Ekle</span></button>
    <div class="title-tools">
      <button class="icon-btn" id="prefsBtn" data-i18n-title="ui.prefs" data-i18n-aria="ui.prefs"></button>
      <button class="icon-btn" id="aboutBtn" data-i18n-title="ui.about" data-i18n-aria="ui.about"></button>
      <button class="icon-btn win-btn" id="minBtn" data-i18n-title="ui.minimize" data-i18n-aria="ui.minimize">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 12h12"/></svg>
      </button>
      <button class="icon-btn win-btn" id="maxBtn" data-i18n-title="ui.maximize" data-i18n-aria="ui.maximize">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
      <button class="icon-btn win-btn close" id="closeBtn" data-i18n-title="ui.close" data-i18n-aria="ui.close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 7l10 10M17 7L7 17"/></svg>
      </button>
    </div>
  </header>

  <div class="notice hidden" id="updateNotice">
    <span id="updateText"></span>
    <button class="btn primary" id="updateBtn" data-i18n="btn.update">Güncelle</button>
  </div>
  <div class="notice hidden" id="quotaNotice"><span id="quotaText"></span></div>

  <div class="body">
    <nav class="sidebar" id="sidebar" data-i18n-aria="ui.sidebar"></nav>
    <main class="listwrap">
      <div class="list-head">
        <h1 id="listTitle"></h1>
        <div class="seg" id="viewSeg" role="tablist">
          <button role="tab" data-view="all" data-i18n="side.all">Tümü</button>
          <button role="tab" data-view="unfinished" data-i18n="side.unfinished">Bitmemiş</button>
          <button role="tab" data-view="completed" data-i18n="side.completed">Tamamlanan</button>
          <button role="tab" data-view="error" data-i18n="side.failed">Hatalı</button>
        </div>
        <div class="sortbox">
          <select class="field mini" id="sortSel" data-i18n-aria="ui.sort"></select>
          <button class="tb small" id="sortDir" data-i18n-title="ui.sort_dir" data-i18n-aria="ui.sort_dir"></button>
        </div>
      </div>
      <div class="list" id="list">
        <div class="list-cols" id="listCols" aria-hidden="true">
          <span class="c-ico"></span><span class="c-name" data-i18n="col.name">Ad</span><span data-i18n="col.size">Boyut</span>
          <span class="c-side" data-i18n="col.status">Durum</span><span class="c-act"></span>
        </div>
        <div class="rows" id="rows"></div>
        <div class="empty-list hidden" id="emptyList">
          <img src="img/logo.png" width="64" alt="">
          <h2 data-i18n="ui.empty_title"></h2>
          <div data-i18n="ui.empty_text"></div>
        </div>
      </div>
    </main>
    <aside class="inspector hidden" id="details" data-i18n-aria="ui.details"></aside>
  </div>

  <footer class="statusbar main-status">
    <span class="total" id="total"></span>
    <span class="msg" id="status"></span>
    <button class="chip" id="limitChip" data-i18n-title="ui.speed_limit"></button>
    <button class="chip" id="clipChip" data-i18n-title="ui.clipboard_monitor"></button>
  </footer>
</div>
<script src="js/common.js"></script>
<script src="js/main.js"></script>
</body>
</html>
