# Elle tetiklenir: Apple Silicon ve Intel Mac'lerde çalışan (universal) imzasız .dmg ve tarayıcı uzantısını üretir.
# İmzasız olduğu için ilk açılışta Gatekeeper uyarır: Finder'da sağ tık > Aç.
name: macOS paketi

on:
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Uzantı (uygulama paketine kaynak olarak girer)
        run: node extension/build.mjs

      # tauri-build, native messaging yardımcısını hedef üçlüsüyle adlandırılmış ister; universal için iki mimari birleşir
      - name: Native messaging yardımcısı (universal)
        run: |
          cargo build --locked --release -p kdm-nmh --target aarch64-apple-darwin
          cargo build --locked --release -p kdm-nmh --target x86_64-apple-darwin
          mkdir -p src-tauri/binaries
          # Universal paket her mimariyi ayrı derler; her derleme kendi üçlüsüyle adlandırılmış kopyayı ister
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cp "target/$t/release/karadelikdm-nmh" "src-tauri/binaries/karadelikdm-nmh-$t"
          done
          lipo -create -output src-tauri/binaries/karadelikdm-nmh-universal-apple-darwin \
            target/aarch64-apple-darwin/release/karadelikdm-nmh target/x86_64-apple-darwin/release/karadelikdm-nmh

      - name: Uygulama paketi
        run: |
          npm ci
          npx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Tarayıcı uzantısı
        working-directory: extension
        run: node build.mjs

      # Actions dosya kotasına sayılmasın diye taslak sürüme yüklenir (taslak yalnız depo erişimi olanlara görünür)
      - name: Taslak sürüme yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=mac-test
          (cd extension && zip -qr ../karadelikdm-extension-chromium.zip chromium && zip -qr ../karadelikdm-extension-firefox.zip firefox)
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --prerelease --target "$GITHUB_SHA" \
            --title "macOS deneme paketi" --notes "İmzasız deneme paketi. İlk açılışta Finder'da sağ tık > Aç."
          gh release upload "$tag" --clobber \
            "target/universal-apple-darwin/release/bundle/dmg/Karadelik Download Manager_0.1.0_universal.dmg" \
            karadelikdm-extension-chromium.zip karadelikdm-extension-firefox.zip
