[package]
name = "karadelikdm"
description = "Karadelik Download Manager"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "karadelikdm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kdm-core = { path = "../crates/kdm-core" }
kdm-bridge = { path = "../crates/kdm-bridge" }
kdm-grabber = { path = "../crates/kdm-grabber" }
kdm-zip = { path = "../crates/kdm-zip" }
kdm-torrent = { path = "../crates/kdm-torrent" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
once_cell = "1"
chrono = "0.4"
dirs = "6"
sys-locale = "0.3"
log = "0.4"
url = "2"
sha2 = "0.10"
hex = "0.4"
percent-encoding = "2"

[dev-dependencies]
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_Shutdown", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell"] }
