[workspace]
members = ["src-tauri", "crates/kdm-core", "crates/kdm-ftp", "crates/kdm-media", "crates/kdm-grabber", "crates/kdm-zip", "crates/kdm-bridge", "crates/kdm-nmh", "crates/kdm-torrent"]
resolver = "2"

[workspace.package]
version = "0.1.0"
